spring.application.name=mym_dentist_commerce
server.port = 8080

#Conection database

# Database connection settings
spring.datasource.url=${DB_PATH:jdbc:mysql://MyMDentistComerce_db:3306/mymdentistcomerce?createDatabaseIfNotExist=true&serverTimezone=UTC}
#spring.datasource.url=jdbc:mysql://localhost:3306/mymdentistcomerce
spring.datasource.username=${DB_USER:root}
#spring.datasource.username=root
spring.datasource.password=${DB_PASS: }
#spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring security

aws.s3.bucket.name=${AWS_BUCKET_NAME:s3-bucket-test-spring}

aws.accessKeyId=${PUBLIC_KEY}
aws.secretKey=${SECRET_KEY}
aws.sessionToken=${TOKEN_KEY}

# CORS Config
spring.cors.origins.test=${LOCAL_PATH}
spring.cors.origins.cloudfront=${CLOUDFRONT_PATH}
spring.cors.origins.s3Bucket=${S3_BUCKET_PAGE}

